# sdlgui 默认配置（TOML）
#
# 根层：全局设置
#   version            配置格式版本，将来改结构时用来做兼容
#   name / description 这份配置的名字和说明，给设置界面显示
#   default            启动时用哪个主题（对应下面的 [表名]）
#   fonts              各级文字字体族（标题 / 副标题 / 正文），不足时沿用最后一项
#   text_size          各级字号，单位 pt
#   icon_path          图标目录；相对 config.toml 所在目录，不写时为 <配置目录>/icon
#   item_height        列表项 / 按钮的高度，单位 px
#   button_height      默认按钮高度，单位 px（不得高于 item_height）
#   button_animation_time  按钮颜色渐变动画时长，单位 ms
#   switch_animation_time  开关旋钮滑动动画时长，单位 ms
#   switch_width       开关总长（宽度），单位 px
#   switch_icon_height   开关旋钮图标边长，单位 px；0 表示跟随开关高度
#   selector_item_width  selector 每项宽度，单位 px
#   slider_animation_time  滑块淡出动画时长，单位 ms
#   slider_width       滑块宽度，单位 px
#   slider_least_height 滑块最小高度，单位 px
#   rect_round_corner  控件圆角半径，单位 px，0 表示直角
#
# 每个主题（[Bright]、[Dark]……）：
#   color[]        调色板，颜色写成 0xRRGGBBAA
#   text_color[]   文字颜色
#   divider_color  分割线颜色（单个 0xRRGGBBAA；不写时用 color[1]）
#   color[5..6]    开关：关闭轨道、打开轨道
#   color[7..8]    滑块：普通、高亮

version = "0.0.1"
name = "Default"
description = "Indigo and slate theme with comfortable typography."
default = "Bright"
fonts = [ "sans-serif" , "sans-serif" , "monospace" ]
text_size = [ 20 , 16 , 14 ]
item_height = 40.0
button_height = 30.0
button_animation_time = 140
switch_animation_time = 160
switch_width = 48.0
switch_icon_height = 0.0
selector_item_width = 96.0
slider_animation_time = 200
slider_width = 6.0
slider_least_height = 28.0
rect_round_corner = 12.0
# icon_path = "icon"

[Bright]
color = [ 0xF7F8FCFF, 0xE9EDF5FF, 0xE0E7FFFF, 0xA5B4FCFF, 0xC7D2FEFF,
          0xD8DFEAFF, 0x818CF8FF, 0xC3CCDAFF, 0x818CF8FF ]
text_color = [ 0x172033FF, 0x334155FF, 0x3B4763FF ]
divider_color = 0xD3DAE6FF

[Dark]
color = [ 0x111522FF, 0x1B2233FF, 0x3730A3FF, 0x4F46E5FF, 0x4338CAFF,
          0x303A4EFF, 0x4F46E5FF, 0x3B465CFF, 0x818CF8FF ]
text_color = [ 0xF8FAFCFF, 0xE2E8F0FF, 0xD5DEEDFF ]
divider_color = 0x2B3548FF
